[project]
name = "cmapss"
version = "0.1.0"
description = "RUL prediction on NASA C-MAPSS with grounded LLM failure explanations"
authors = [{ name = "Louis Adams", email = "louistadams3@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "stream-unzip>=0.0.101",
    "tabulate>=0.10.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
